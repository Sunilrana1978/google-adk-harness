[project]
name = "harness-demo"
version = "0.2.0"
description = "Generic ADK agent harness driven by Markdown skills"
requires-python = ">=3.11"
# 1.17.0 is the first ADK release with built-in OpenTelemetry. Developed and tested on 2.13.0.
dependencies = [
    "a2a-sdk[http-server]~=0.3.22",
    "aiohttp>=3.13.4",
    "google-adk[gcp]>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pyyaml",
    "google-agents-cli",  # only used to validate the eval dataset against its own schema
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:.*EXPERIMENTAL.*:UserWarning"]
